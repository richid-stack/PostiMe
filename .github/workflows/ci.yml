name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/gen-accents.mjs && git diff --exit-code theme/accents.css
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npm test
      - run: npm run build:web
